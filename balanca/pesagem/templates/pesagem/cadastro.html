<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cadastro de Caminhões</title>
    <style>
        /* Estilos Globais */
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Arial', sans-serif;
        }

        body {
            background-color: #f4f7f9;
            padding: 20px;
        }

        h1, h2 {
            text-align: center;
            color: #333;
        }

        form {
            background-color: white;
            max-width: 800px;
            margin: 20px auto;
            padding: 20px;
            border-radius: 10px;
            box-shadow: 0 0 10px rgba(0, 0, 0, 0.1);
        }

        label {
            display: block;
            font-weight: bold;
            margin-bottom: 5px;
            color: #555;
        }

        input[type="text"], input[type="number"], select, textarea {
            width: 100%;
            padding: 10px;
            margin-bottom: 15px;
            border: 1px solid #ddd;
            border-radius: 5px;
            font-size: 14px;
        }

        textarea {
            resize: none;
            height: 100px;
        }

        input[type="submit"] {
            background-color: #28a745;
            color: white;
            border: none;
            padding: 15px;
            font-size: 16px;
            border-radius: 5px;
            cursor: pointer;
            transition: background-color 0.3s;
        }

        input[type="submit"]:hover {
            background-color: #218838;
        }

        .form-group {
            margin-bottom: 20px;
        }

        .form-row {
            display: flex;
            justify-content: space-between;
            gap: 20px;
        }

        .form-row .form-group {
            flex: 1;
        }

        .container {
            max-width: 1200px;
            margin: 0 auto;
            padding: 20px;
        }

        @media (max-width: 768px) {
            .form-row {
                flex-direction: column;
            }
        }

        /* Estilos para a Cabeçalho da Página */
        .header {
            text-align: center;
            margin-bottom: 20px;
        }

        .header p {
            color: #777;
            font-size: 18px;
        }

        /* Estilos Específicos de Feedback */
        .form-group.error input, .form-group.error select, .form-group.error textarea {
            border-color: #dc3545;
        }

        .form-group.error .error-message {
            color: #dc3545;
            font-size: 12px;
            margin-top: -10px;
            margin-bottom: 10px;
        }

    </style>
</head>
<body>

    <!-- Container principal -->
    <div class="container">
        <!-- Cabeçalho da Página -->
        <div class="header">
            <h1>Cadastro de Caminhões, Clientes e Cargas</h1>
            <p>Preencha os dados abaixo para registrar um novo caminhão, cliente e sua respectiva carga</p>
        </div>

        <!-- Formulário de Cadastro -->
        <form action="#" method="POST">
            <!-- Seção de Dados do Caminhão -->
            <h2>Dados do Caminhão</h2>
            <div class="form-row">
                <div class="form-group">
                    <label for="placa">Placa do Caminhão</label>
                    <input type="text" id="placa" name="placa" placeholder="Ex: ABC-1234" required>
                </div>
                <div class="form-group">
                    <label for="modelo">Modelo</label>
                    <input type="text" id="modelo" name="modelo" placeholder="Modelo do Caminhão" required>
                </div>
            </div>

            <div class="form-row">
                <div class="form-group">
                    <label for="peso">Peso Máximo (kg)</label>
                    <input type="number" id="peso" name="peso" placeholder="Capacidade máxima do caminhão em kg" required>
                </div>
                <div class="form-group">
                    <label for="ano">Ano de Fabricação</label>
                    <input type="number" id="ano" name="ano" placeholder="Ano de fabricação do caminhão" required>
                </div>
            </div>

            <!-- Seção de Dados do Cliente -->
            <h2>Dados do Cliente</h2>
            <div class="form-row">
                <div class="form-group">
                    <label for="cliente">Nome do Cliente</label>
                    <input type="text" id="cliente" name="cliente" placeholder="Nome completo do cliente" required>
                </div>
                <div class="form-group">
                    <label for="cnpj">CNPJ do Cliente</label>
                    <input type="text" id="cnpj" name="cnpj" placeholder="CNPJ do cliente" required>
                </div>
            </div>

            <div class="form-row">
                <div class="form-group">
                    <label for="telefone">Telefone de Contato</label>
                    <input type="text" id="telefone" name="telefone" placeholder="Telefone para contato" required>
                </div>
                <div class="form-group">
                    <label for="email">Email</label>
                    <input type="text" id="email" name="email" placeholder="Email do cliente" required>
                </div>
            </div>

            <!-- Seção de Dados da Carga -->
            <h2>Dados da Carga</h2>
            <div class="form-row">
                <div class="form-group">
                    <label for="tipo-carga">Tipo de Carga</label>
                    <select id="tipo-carga" name="tipo-carga" required>
                        <option value="">Selecione o tipo de carga</option>
                        <option value="perecivel">Perecível</option>
                        <option value="nao-perecivel">Não Perecível</option>
                        <option value="quimica">Química</option>
                        <option value="industrial">Industrial</option>
                        <option value="outras">Outras</option>
                    </select>
                </div>
                <div class="form-group">
                    <label for="peso-carga">Peso da Carga (kg)</label>
                    <input type="number" id="peso-carga" name="peso-carga" placeholder="Peso total da carga em kg" required>
                </div>
            </div>

            <div class="form-group">
                <label for="descricao-carga">Descrição da Carga</label>
                <textarea id="descricao-carga" name="descricao-carga" placeholder="Descreva a carga transportada" required></textarea>
            </div>

            <!-- Botão de Envio -->
            <input type="submit" value="Cadastrar Caminhão e Carga">
        </form>
    </div>

</body>
</html>
