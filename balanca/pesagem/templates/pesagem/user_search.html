<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}Django Frontend{% endblock %}</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0-alpha1/dist/css/bootstrap.min.css">
</head>
<body>
    <nav class="navbar navbar-expand-lg navbar-light bg-light">
        <div class="container">
            <a class="navbar-brand" href="/">Django App</a>
        </div>
    </nav>
    <div class="container mt-4">
        <h1 class="mb-4">Buscar Usuário por CardNo</h1>

        <!-- Formulário -->
        <form method="get" action="{% url 'get_all_users' %}">
            <div class="mb-3">
                <label for="cardNo" class="form-label">CardNo</label>
                <input type="text" class="form-control" id="cardNo" name="card_no" placeholder="Digite o CardNo" required>
            </div>
            <button type="submit" class="btn btn-primary">Buscar</button>
        </form>
       
        
        <!-- Resultados -->
        {% if user_data %}
            <h2 class="mt-4">Resultado</h2>
            {% if user_data.error %}
                <div class="alert alert-danger">
                    {{ user_data.error }}
                </div>
            {% else %}
                <ul class="list-group">
                    {% for key, value in user_data.items %}
                        <li class="list-group-item">
                            <strong>{{ key }}:</strong> {{ value }}
                        </li>
                    {% endfor %}
                </ul>
            {% endif %}
        {% endif %}
    </div>
      
    <div class="container mt-4">
        {% block content %}
        {% endblock %}
    </div>

</body>
</html>
