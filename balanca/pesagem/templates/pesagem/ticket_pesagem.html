<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sistema de Pesagem</title>
    <script src="https://ajax.googleapis.com/ajax/libs/jquery/3.6.0/jquery.min.js"></script>
    <style>
        /* Reset básico */
body, h1, h2, form, input, button, label, ul, li {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
}

/* Estilo geral da página */
body {
    font-family: 'Arial', sans-serif;
    background-color: #f5f7fa;
    color: #333;
    line-height: 1.6;
    padding: 20px;
}

/* Título principal */
h1 {
    text-align: center;
    font-size: 2.5rem;
    color: #2a9df4;
    margin-bottom: 20px;
}

/* Títulos secundários */
h2 {
    margin-top: 20px;
    font-size: 1.5rem;
    color: #333;
    border-bottom: 2px solid #2a9df4;
    padding-bottom: 5px;
}

/* Formulário */
form {
    background: #ffffff;
    border: 1px solid #e1e5eb;
    border-radius: 8px;
    box-shadow: 0 4px 6px rgba(0, 0, 0, 0.1);
    max-width: 600px;
    margin: 0 auto;
    padding: 20px;
}

/* Labels */
label {
    display: block;
    font-weight: bold;
    margin-bottom: 5px;
    color: #555;
}

/* Inputs */
input[type="text"],
input[type="number"] {
    width: 100%;
    padding: 10px;
    margin-bottom: 15px;
    border: 1px solid #ddd;
    border-radius: 4px;
    background: #f9f9f9;
    font-size: 1rem;
    color: #333;
}

/* Campos somente leitura */
input[readonly] {
    background: #e9ecef;
    cursor: not-allowed;
}

/* Botões */
button {
    background: #2a9df4;
    color: #fff;
    padding: 10px 15px;
    border: none;
    border-radius: 4px;
    font-size: 1rem;
    cursor: pointer;
    transition: background 0.3s;
}

button:hover {
    background: #2278c9;
}

button:disabled {
    background: #ccc;
    cursor: not-allowed;
}

/* Feedback de mensagens */
ul {
    list-style: none;
    margin: 20px 0;
    padding: 0;
}

ul li {
    padding: 10px;
    margin-bottom: 5px;
    border-radius: 4px;
    font-size: 0.9rem;
}

ul li:nth-child(odd) {
    background: #2a9df4;
    color: #fff;
}

ul li:nth-child(even) {
    background: #e1e5eb;
    color: #333;
}

/* Responsividade */
@media (max-width: 768px) {
    form {
        padding: 15px;
    }

    h1 {
        font-size: 2rem;
    }

    h2 {
        font-size: 1.25rem;
    }

    input[type="text"],
    input[type="number"] {
        font-size: 0.9rem;
    }

    button {
        padding: 8px 12px;
        font-size: 0.9rem;
    }
}

    </style>
</head>
<body>
    
        <form method="POST" action="{% url 'ticket_pesagem' %}">{% csrf_token %}
        
        <label for="user_id">Buscar Cliente (User ID):</label>
        <input type="text" id="user_id" name="user_id" placeholder="Digite o User ID">
        <button type="button" id="buscar_cliente">Buscar</button>

        <h2>Dados do Cliente</h2>
        <label for="nome">Nome:</label>
        <input type="text" id="nome" name="nome" readonly>

        <label for="cnpj">CNPJ:</label>
        <input type="text" id="cnpj" name="cnpj" readonly>

        <h2>Dados do Caminhão</h2>
        <label for="placa">Placa:</label>
        <input type="text" id="placa" name="placa" readonly>

        <label for="modelo">Modelo:</label>
        <input type="text" id="modelo" name="modelo" readonly>

        <label for="peso_maximo">Peso TARA:</label>
        <input type="text" id="peso_maximo" name="peso_maximo" readonly>

        <h2>Pesagem</h2>
        <label for="peso_final">Peso Final:</label>
        <input type="number" id="peso_final" name="peso_final" placeholder="Peso sendo obtido..." readonly>
        
        <!-- Campo de Data e Hora -->
        <label for="data_hora">Data e Hora:</label>
        <input type="text" id="data_hora" name="data_hora" readonly>

        <button type="submit">Registrar Peso</button>


    </form>
    <form>
        <h2>Resultado da Pesagem</h2>
        <label for="peso_liquido">Peso Líquido:</label>
        <input type="number" id="peso_liquido" name="peso_liquido" readonly>

        <p><strong>Local para Descarga/Tipo de Carga:</strong>...................................</p>


    </form>

    <script> 
    // Atualiza o campo data e hora com o valor atual
        function atualizarDataHora() {
            const agora = new Date();
            const formatoDataHora = agora.toLocaleString('pt-BR', {
                day: '2-digit',
                month: '2-digit',
                year: 'numeric',
                hour: '2-digit',
                minute: '2-digit',
                second: '2-digit'
            });
            document.getElementById('data_hora').value = formatoDataHora;
        }
        atualizarDataHora(); // Atualiza ao carregar a página

        </script>
        
    <script>

    $(document).ready(function () {
        $('#buscar_cliente').click(function () {
            const userId = $('#user_id').val();
            if (userId) {
                $.ajax({
                    url: "{% url 'ticket_pesagem' %}",
                    data: { user_id: userId },
                    success: function (response) {
                        if (response.status === 'success') {
                            const cliente = response.cliente;
                            $('#nome').val(cliente.nome);
                            $('#cnpj').val(cliente.cnpj);
                            $('#placa').val(cliente.placa);
                            $('#modelo').val(cliente.modelo);
                            $('#peso_maximo').val(cliente.peso_maximo);
                        } else {
                            alert(response.message);
                        }
                    },
                    error: function () {
                        alert('Erro ao buscar cliente.');
                    }
                });
            } else {
                alert('Digite um User ID válido.');
            }
        });

        function atualizarPesoFinal() {
            $.ajax({
                url: "{% url 'obter_peso_final' %}",
                method: "GET",
                success: function (response) {
                    if (response.status === 'success') {
                        const pesoFinal = response.peso_final;
                        const pesoMaximo = parseFloat($('#peso_maximo').val()) || 0;

                        // Atualiza o campo de peso final
                        $('#peso_final').val(pesoFinal);

                        // Calcula o peso líquido
                        const pesoLiquido = pesoFinal - pesoMaximo;

                        // Atualiza o campo de peso líquido
                        $('#peso_liquido').val(pesoLiquido.toFixed(2));
                    } else {
                        console.error(response.message);
                    }
                },
                error: function () {
                    console.error('Erro ao obter o peso final.');
                }
            });
        }

        // Atualiza o peso final e o peso líquido a cada 5 segundos
        setInterval(atualizarPesoFinal, 5000);
    });
</script>

    <script>
        function atualizarPesoFinal() {
            $.ajax({
                url: "{% url 'obter_peso_final' %}",
                method: "GET",
                success: function(response) {
                    if (response.status === 'success') {
                        // Atualiza o campo de peso final com o valor retornado pela API
                        $('#peso_final').val(response.peso_final);
                    } else {
                        console.error(response.message);
                    }
                },
                error: function() {
                    console.error('Erro ao obter o peso final.');
                }
            });
        }
    
        // Chama a função a cada 5 segundos para atualizar o peso
        setInterval(atualizarPesoFinal, 5000);
    </script>
   
</body>
</html>
